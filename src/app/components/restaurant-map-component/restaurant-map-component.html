<!--
leaflet est une directive attributaire ==> ajoute un comportement à un élément HTML existant.
((([leafletOptions]="..." est un property binding Angular ==> Passe au composant Leaflet la valeur de la propriété "leafletOptions")))
-->
<div id="restaurant-map" class="map h-screen w-full"
    leaflet
    [leafletOptions]="leafletOptions"
    [leafletCenter]="center">


</div>
