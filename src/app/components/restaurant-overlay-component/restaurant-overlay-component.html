<div class="w-full rounded-t-3xl bg-white p-4">
  @if (currentPOI) {
    <p class="text-xs">
      {{ currentPOI.address }}
    </p>
    <button
      type="button"
      class="mt-4 cursor-pointer rounded-lg bg-yellow-400 px-3 py-2 text-xs font-semibold text-black transition hover:bg-yellow-500"
      (click)="onClickContinue()">
      Continuer
    </button>
  } @else { 
    <p class="text-sm font-semibold">
      Aucun restaurant sélectionné
    </p>
  }
</div>
