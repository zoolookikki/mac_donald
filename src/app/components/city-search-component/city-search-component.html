<!-- bg-white/70 : fond blanc avec 70% d’opacité pour donner un effet verre -->
<div class="rounded-2xl bg-white/70 shadow-md">
  <div class="px-4 pt-3 text-sm font-semibold text-slate-900">
    Rechercher un restaurant
  </div>

  <form
    class="flex gap-2 px-4 pb-4 pt-2"
    [formGroup]="citySearchForm"
    (ngSubmit)="onSubmit()">

    <input
      type="text"
      formControlName="city"
      class="w-full rounded-lg border border-black/30 bg-white px-3 py-2 text-sm outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200"
      placeholder="Saisissez une ville"
      autofocus
    />

    <!-- aria-label="Rechercher" ==> accessabilité : pour un lecteur d'écran, le bouton est annoncé comme "rechercher" -->
     <button
      type="submit"
      class="flex h-10 w-10 shrink-0 cursor-pointer items-center justify-center rounded-lg bg-yellow-400 text-black shadow-sm transition hover:bg-yellow-500 active:bg-yellow-600 disabled:cursor-not-allowed disabled:opacity-40"
      aria-label="Rechercher"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-5 w-5"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <circle cx="11" cy="11" r="8"></circle>
        <path d="m21 21-4.35-4.35"></path>
      </svg>
    </button>
  </form>

  @if (suggestions().length > 0) {
    <ul class="px-4 pb-4 space-y-2">
      <!-- suggestions() car suggestion est un signal. -->
      @for (suggestion of suggestions(); track suggestion.id) {
        <li
          class="cursor-pointer rounded-lg border border-black/30 bg-white px-3 py-2 text-sm hover:bg-gray-200 transition"
          (click)="onClickSuggestion(suggestion)"
        >
          {{ suggestion.name }}
        </li>
      }
    </ul>
  }

  @if (errorMessage()) {
    <div class="px-4 pb-3 text-sm text-red-600">
      {{ errorMessage() }}
    </div>
  }

</div>
